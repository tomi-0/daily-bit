name: Fetch RSS Feeds

# Controls when the workflow will run
on:
  schedule:
  # Workflow runs at 00:00 every day
    - cron: "0 0 * * *"
  # a manual trigger 
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "fetch-rss"
  fetch-rss:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./server

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout code repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip" # speeds up every future run by reusing downloaded packages

      # Install required dependencies
      - name: Install required script dependencies
        run: pip install -r requirements.txt

      # Runs script for pipeline
      - name: Run custom script for data ingestion 
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          # should move to variables instead
          DEPLOYMENT: ${{ secrets.DEPLOYMENT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m scripts.run_pipeline

